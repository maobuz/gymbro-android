<style>
/* Layout: single mobile column, sticky header, fixed bottom tab bar, rest timer docked above it */
:root{
  --bg:#eceff2; --surface:#ffffff; --surface-2:#f5f7f9; --ink:#15181c; --muted:#5b6570; --line:#d3d9df;
  --accent:#e2aa00; --accent-ink:#15181c; --accent-text:#8a6400; --done:#23824f; --done-soft:#e1f2e8; --danger:#b3261e;
  --f-display:"Saira Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:12px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111316; --surface:#1a1e23; --surface-2:#22272d; --ink:#eceff2; --muted:#9aa4ae; --line:#2c333a;
  --accent:#f2c230; --accent-ink:#15181c; --accent-text:#f2c230; --done:#52c487; --done-soft:#17301f; --danger:#ff8a80; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111316; --surface:#1a1e23; --surface-2:#22272d; --ink:#eceff2; --muted:#9aa4ae; --line:#2c333a;
  --accent:#f2c230; --accent-ink:#15181c; --accent-text:#f2c230; --done:#52c487; --done-soft:#17301f; --danger:#ff8a80; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:18.5px;line-height:1.45;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:640px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 170px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:14px 10px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{font-family:var(--f-display);font-weight:700;font-size:clamp(19px,5.6vw,26px);letter-spacing:.02em;text-transform:uppercase;line-height:1;display:flex;align-items:center;gap:8px;white-space:nowrap;min-width:0}
.brand i{display:inline-block;width:10px;height:22px;background:var(--accent);border-radius:2px}
.sync{font-size:15px;color:var(--muted);display:flex;align-items:center;gap:6px;white-space:nowrap}
.sync b{width:7px;height:7px;border-radius:50%;background:var(--muted)}
.sync.cloud b{background:var(--done)}
h1{font-family:var(--f-display);font-weight:700;font-size:32px;line-height:1.05;margin:8px 0 4px;text-wrap:balance;text-transform:uppercase;letter-spacing:.01em}
h2{overflow-wrap:anywhere;font-family:var(--f-display);font-weight:600;font-size:25px;margin:0;line-height:1.15;text-wrap:balance}
.sub{color:var(--muted);margin:0 0 16px}
.stack{display:flex;flex-direction:column;gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.label{font-size:14px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-bottom:18px}
.stat{min-width:0;overflow-wrap:anywhere;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.stat .v{font-family:var(--f-display);font-weight:600;font-size:26px;line-height:1.1;font-variant-numeric:tabular-nums}
.stat .v small{font-size:17px;color:var(--muted);font-weight:500}
.btn{border:1px solid var(--line);background:var(--surface-2);border-radius:10px;padding:10px 14px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--danger)}
.btn.block{width:100%}
.btn.sm{min-height:34px;padding:6px 10px;font-size:16.5px}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.grow{flex:1;min-width:0}
.scheda-card .exl{color:var(--muted);font-size:16.5px;margin:6px 0 12px}
.meta{font-size:16.5px;color:var(--muted)}
.back{background:none;border:0;padding:6px 0;color:var(--muted);font-weight:600;display:inline-flex;gap:6px;align-items:center;min-height:40px}
/* session */
.ex{padding:0;overflow:hidden}
.ex-head{padding:14px 14px 10px;display:flex;gap:10px;align-items:flex-start;justify-content:space-between}
.tag{font-size:14px;font-weight:600;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:2px 8px;white-space:nowrap}
.target{font-family:var(--f-display);font-size:20px;font-weight:600;font-variant-numeric:tabular-nums}
.hint{margin:0 14px 10px;font-size:16.5px;color:var(--muted)}
.hint .up{color:var(--accent-text);font-weight:700}

.set{display:grid;grid-template-columns:28px 1fr 1fr 52px;gap:8px;align-items:center;padding:8px 14px;border-bottom:1px solid var(--line)}
.set:last-child{border-bottom:0}
.set .n{font-family:var(--f-display);font-weight:600;color:var(--muted);font-size:21.5px;text-align:center}
.field{position:relative}

.field span{position:absolute;right:10px;top:50%;transform:translateY(-50%);font-size:15px;color:var(--muted);pointer-events:none}
.check{width:52px;height:44px;border-radius:9px;border:2px solid var(--line);background:transparent;display:grid;place-items:center}

.set.done{background:var(--done-soft)}
.coach{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 14px;margin-bottom:14px;font-size:17px}

.coach ul{margin:8px 0 2px;padding-left:18px;display:flex;flex-direction:column;gap:4px}
.set.done .vals{grid-column:2 / 4;font-family:var(--f-display);font-size:23.5px;font-weight:600;font-variant-numeric:tabular-nums}
.set.done .check{background:var(--done);border-color:var(--done);color:#fff}
.set.done .n{color:var(--done)}
.ex-foot{display:flex;justify-content:space-between;gap:8px;padding:8px 14px 12px}
.progress{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin:4px 0 16px}

.ed-item label{display:flex;flex-direction:column;gap:4px;font-size:15px;color:var(--muted);font-weight:600}

.sheet-in{background:var(--bg);width:100%;max-width:640px;max-height:88%;border-radius:16px 16px 0 0;display:flex;flex-direction:column;padding:14px max(16px,env(safe-area-inset-right,0px)) calc(14px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}

.chips{display:flex;gap:6px;overflow-x:auto;padding:10px 0;scrollbar-width:none;flex-shrink:0}

.hist{display:flex;flex-direction:column}

.hist b{font-weight:600;color:var(--muted);font-variant-numeric:tabular-nums}

/* corsa */
.runs{display:flex;flex-direction:column}

.src{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--accent-text)}

.plan{padding:12px 0;border-bottom:1px solid var(--line)}
.plan:last-child{border-bottom:0;padding-bottom:0}
.plan h2{font-size:22.5px}
.pdesc{margin:6px 0 0;font-size:17px}
.steps{margin:8px 0 0;padding-left:20px;font-size:16.5px;color:var(--muted);display:flex;flex-direction:column;gap:3px}
.pbox{background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:12px;font-size:18.5px}

.seg button{border:0;background:transparent;border-radius:8px;min-height:38px;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.15)}

#timer{position:fixed;left:0;right:0;bottom:calc(64px + env(safe-area-inset-bottom,0px));z-index:20;padding:0 max(12px,env(safe-area-inset-right,0px)) 8px max(12px,env(safe-area-inset-left,0px));pointer-events:none}

<script>
/* Ponte Android: legge i sensori Garmin direttamente da Home Assistant */
(function(){
  const LS="gymbro-ha";
  const cfg=()=>{try{return JSON.parse(localStorage.getItem(LS))||{};}catch(e){return {};}};
  async function getStates(ids){
    const c=cfg(); if(!c.url||!c.token) throw {code:"server_not_connected"};
    const states={};
    await Promise.all(ids.map(async id=>{
      let r; try{r=await fetch(c.url+"/api/states/"+encodeURIComponent(id),{headers:{Authorization:"Bearer "+c.token}});}
      catch(e){throw {code:"server_unavailable",retryable:true};}
      if(r.status===401||r.status===403) throw {code:"needs_reauth"};
      if(r.status===404) return;
      if(!r.ok) throw {code:"server_unavailable",retryable:true};
      const j=await r.json(); states[id]={state:j.state,attributes:j.attributes||{}};
    }));
    return {data:{states}};
  }
  const run=input=>getStates([].concat((input&&input.entity_id)||[])).then(p=>({content:[],payload:p}));
  const watches=new Set();
  const mcp={
    callTool:(s,t,input)=>run(input),
    watchTool:(s,t,input,h,o)=>{const w={};w.go=()=>run(input).then(r=>h({type:"data",result:r}),e=>h({type:"error",error:e}));
      w.timer=setInterval(()=>{if(!document.hidden)w.go();},(o&&o.refetchInterval)||600000);watches.add(w);setTimeout(w.go,0);
      return ()=>{clearInterval(w.timer);watches.delete(w);};},
    invalidate:async()=>{watches.forEach(w=>w.go());}
  };
  document.addEventListener("visibilitychange",()=>{if(!document.hidden)watches.forEach(w=>w.go());});
  window.GB_ANDROID={cfg,setCfg:c=>{try{localStorage.setItem(LS,JSON.stringify(c));}catch(e){}},refresh:()=>watches.forEach(w=>w.go())};
  window.claude={use:async n=>n==="mcp"?mcp:null};
})();
</script>

function writeDoc(id,body){

    else if(c==="invalid_argument"||c==="revoked"||c==="not_granted"){COL=null;mode="local";renderSync();}
  });
}

let cloudReady=false;

async function initCloud(){
  const ready=()=>{cloudReady=true;importOttobre();tryImportRuns();};
  if(!window.claude||!window.claude.use) return ready();
  const [db,user]=await Promise.all([claude.use("db"),claude.use("user")]);
  if(!db||!user) return ready();
  const uid=await user.id(); if(!uid) return ready();
  COL=db.collection("data/users/"+uid);
  let settled=false;
  const t=setTimeout(()=>{if(mode!=="cloud"){document.querySelector("#sync span").textContent="Cloud non raggiungibile";}},10000);
  COL.onSnapshot(snap=>{
    if(!snap.metadata.fromCache){clearTimeout(t);mode="cloud";renderSync();}
    if(snap.empty){
      if(!snap.metadata.fromCache&&!settled){settled=true;
        if(!state.esempio) saveConfig();
        Object.keys(state.months).forEach(saveMonth);
        if(state.garmin&&Object.keys(state.garmin).length) saveGarmin();
        if((state.runs&&state.runs.length)||(state.runPlans&&state.runPlans.length)) saveRuns();
        ready();
      }
      return;
    }
    settled=true;
    const next={schede:state.schede,custom:state.custom,months:{},esempio:state.esempio,garmin:state.garmin||{},runs:state.runs||[],runsHidden:state.runsHidden||[],runPlans:state.runPlans||[],imports:state.imports||[],ver:state.ver};
    snap.docs.forEach(d=>{const b=clone(d.data()||{});
      if(d.id==="config"){next.schede=b.schede||[];next.custom=b.custom||[];next.imports=b.imports||[];next.esempio=false;}
      else if(d.id==="garmin") next.garmin=b.days||{};
      else if(d.id==="runs"){next.runs=b.list||[];next.runsHidden=b.hidden||[];next.runPlans=b.plans||[];}
      else if(d.id.startsWith("m-")) next.months[d.id]=b.sets||[];});
    state=next; lsSave(); softRender();
    if(!snap.metadata.fromCache&&!cloudReady) ready();
  },()=>{clearTimeout(t);COL=null;mode="local";renderSync();ready();});
}

const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const num=v=>{const n=parseFloat(String(v).replace(",","."));return isFinite(n)?n:NaN};
const fmt=n=>(Math.round(n*100)/100).toString().replace(".",",");
const dayKey=t=>{const d=new Date(t);return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};
const monthKey=t=>"m-"+dayKey(t).slice(0,7);
const MESI=["gen","feb","mar","apr","mag","giu","lug","ago","set","ott","nov","dic"];
const dShort=k=>{const [y,m,d]=k.split("-");return (+d)+" "+MESI[+m-1]};
const exInfo=id=>CATMAP[id]||(state.custom||[]).find(c=>c.id===id)||{id,n:id,g:"Altro",e:""};
const allSets=()=>Object.values(state.months).flat();
const uid=()=>Math.random().toString(36).slice(2,9);
const fmtTime=s=>{s=Math.max(0,Math.round(s));return Math.floor(s/60)+":"+String(s%60).padStart(2,"0")};
const inc=ex=>{const e=exInfo(ex).e;return e==="Manubri"?2:(e==="Corpo libero"||e==="Cardio")?0:2.5};
const UNIT={rip:"rip",sec:"sec",min:"min"}, MARK={sec:"″",min:"′"};
const e1rm=(w,r)=>w*(1+r/30);

function setsByDay(ex){const m={};allSets().forEach(s=>{if(s.ex===ex){(m[dayKey(s.t)]||(m[dayKey(s.t)]=[])).push(s)}});Object.values(m).forEach(a=>a.sort((x,y)=>x.t-y.t));return m;}
function todaySets(ex){return (setsByDay(ex)[dayKey(Date.now())]||[]);}
function lastSession(ex){const m=setsByDay(ex),today=dayKey(Date.now());const k=Object.keys(m).filter(k=>k!==today).sort().pop();return k?{day:k,sets:m[k]}:null;}
function suggestion(item){
  const last=lastSession(item.ex); if(!last) return null;
  const W=Math.max(...last.sets.map(s=>s.w));
  const top=last.sets.filter(s=>s.w===W);
  const hit=last.sets.length>=item.serie&&top.every(s=>s.r>=item.rMax);
  return {last,W,up:hit,next:hit?W+inc(item.ex):W,bodyweight:inc(item.ex)===0};
}

function weekStats(){
  const since=Date.now()-7*864e5; const s=allSets().filter(x=>x.t>=since);
  return {giorni:new Set(s.map(x=>dayKey(x.t))).size,serie:s.length,vol:s.reduce((a,x)=>a+x.w*x.r,0)};
}
function lastDone(sid){const s=allSets().filter(x=>x.s===sid);if(!s.length)return null;return dayKey(Math.max(...s.map(x=>x.t)));}

const CHECK=`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7"/></svg>`;
function vSessione(){
  const s=state.schede.find(x=>x.id===sessId); if(!s){view="oggi";return vOggi();}
  let tot=0,done=0;
  const cards=s.esercizi.map((item,idx)=>{
    const U=item.u||"rip", timed=U!=="rip";
    const info=exInfo(item.ex), today=todaySets(item.ex), sg=timed?null:suggestion(item);
    const rows=Math.max(item.serie,today.length+(draft[item.ex+":extra"]||0));
    tot+=item.serie; done+=Math.min(today.length,item.serie);
    let hint=timed?(U==="min"?"Segna i minuti svolti.":"Esercizio a tempo: segna i secondi di lavoro."):"Prima volta: scegli un peso con cui completi le ripetizioni con 1–2 di margine.";
    if(sg){const lastTxt=`${dShort(sg.last.day)}: ${fmt(sg.W)} kg × ${sg.last.sets.map(x=>x.r).join(", ")}`;
      hint=sg.bodyweight?`Ultima ${lastTxt}${sg.up?' · <span class="up">aggiungi ripetizioni o zavorra</span>':""}`:
      sg.up?`Ultima ${lastTxt} · <span class="up">oggi prova ${fmt(sg.next)} kg ↑</span>`:`Ultima ${lastTxt} · oggi resta su ${fmt(sg.W)} kg`;}
    const defW=sg?sg.next:"";
    let html="";
    for(let i=0;i<rows;i++){
      const d=today[i];
      if(d){html+=`<div class="set done"><div class="n">${i+1}</div><div class="vals">${timed?d.r+" "+UNIT[U]:fmt(d.w)+" kg × "+d.r}</div>
        <button class="check" data-act="undo" data-ex="${item.ex}" data-t="${d.t}" aria-label="Annulla serie ${i+1}">${CHECK}</button></div>`;}
      else{const k=item.ex+":"+i, dv=draft[k]||{}, prevW=i>0&&today[i-1]?today[i-1].w:defW;
        html+=`<div class="set"><div class="n">${i+1}</div>
        ${timed?"<div></div>":`<div class="field"><input id="w-${idx}-${i}" inputmode="decimal" data-d="${k}" data-f="w" value="${esc(dv.w??(prevW!==""?fmt(prevW):""))}" placeholder="0" aria-label="Peso serie ${i+1}"><span>kg</span></div>`}
        <div class="field"><input id="r-${idx}-${i}" inputmode="numeric" data-d="${k}" data-f="r" value="${esc(dv.r??item.rMax)}" aria-label="${timed?"Durata":"Ripetizioni"} serie ${i+1}"><span>${UNIT[U]}</span></div>
        <button class="check" data-act="log" data-ex="${item.ex}" data-k="${k}" data-rec="${item.rec}" aria-label="Completa serie ${i+1}"></button></div>`;}
    }
    return `<div class="card ex"><div class="ex-head"><div class="grow"><h2>${esc(info.n)}</h2><div class="meta">${esc(info.e||info.g)} · ${item.rec>0?"recupero "+fmtTime(item.rec):"senza recupero"}${item.nota?" · "+esc(item.nota):""}</div></div>
      <div class="target">${item.serie}×${item.rMin===item.rMax?item.rMax:item.rMin+"–"+item.rMax}${MARK[U]||""}</div></div>
      <p class="hint">${hint}</p><div class="sets">${html}</div>
      <div class="ex-foot"><button class="btn sm ghost" data-act="extra" data-ex="${item.ex}">+ Serie</button>
      ${item.rec>0?`<button class="btn sm ghost" data-act="timer" data-rec="${item.rec}" data-name="${esc(info.n)}">Avvia recupero</button>`:""}</div></div>`;
  }).join("");
  return `<button class="back" data-act="tab" data-v="oggi">‹ Schede</button>
  <div class="row between"><h1>${esc(s.nome)}</h1><span class="meta">${done}/${tot} serie</span></div>

  ${garmin.status==="ok"?`<p class="meta" style="margin:-6px 0 14px">Oggi: <b>${verdict(garmin.data).t}</b>${garmin.data.bb!=null?" · Body Battery "+garmin.data.bb:""}${garmin.data.sonno!=null?" · Sonno "+garmin.data.sonno:""}</p>`:""}

  <div style="margin-top:16px"><button class="btn primary block" data-act="finish">Fine allenamento</button></div>`;
}

function vProgPalestra(){
  const used=[...new Set(allSets().filter(s=>s.w>0).map(s=>s.ex))];
  if(!used.length) return `<div class="card empty"><strong>Ancora nessun dato</strong>Completa la prima serie da Allenamento: qui vedrai l'andamento dei pesi per ogni esercizio.</div>`;
  used.sort((a,b)=>exInfo(a).n.localeCompare(exInfo(b).n,"it"));
  if(!progEx||!used.includes(progEx)){const last=allSets().sort((a,b)=>b.t-a.t)[0];progEx=last.ex;}
  const m=setsByDay(progEx), days=Object.keys(m).sort();
  const pts=days.map(k=>({k,w:Math.max(...m[k].map(s=>s.w)),rm:Math.max(...m[k].map(s=>e1rm(s.w,s.r))),vol:m[k].reduce((a,s)=>a+s.w*s.r,0)}));
  const rec=Math.max(...pts.map(p=>p.w)), bestRm=Math.max(...pts.map(p=>p.rm));
  const first=pts[0].w, delta=pts[pts.length-1].w-first;
  return `
  <label class="label" for="pe">Esercizio</label>
  <select class="inp" id="pe" style="margin:6px 0 14px">${used.map(id=>`<option value="${id}" ${id===progEx?"selected":""}>${esc(exInfo(id).n)}</option>`).join("")}</select>
  <div class="stats"><div class="stat"><div class="label">Record</div><div class="v">${fmt(rec)}<small> kg</small></div></div>
  <div class="stat"><div class="label">Massimale st.</div><div class="v">${fmt(Math.round(bestRm*2)/2)}<small> kg</small></div></div>
  <div class="stat"><div class="label">Dall'inizio</div><div class="v">${delta>0?"+":""}${fmt(delta)}<small> kg</small></div></div></div>
  <div class="card" style="margin-bottom:12px"><div class="label">Peso massimo per seduta</div>${chart(pts)}</div>
  <div class="card"><div class="label" style="margin-bottom:4px">Storico</div><div class="hist">${days.slice().reverse().slice(0,15).map(k=>`<div><b>${dShort(k)}</b><span>${m[k].map(s=>fmt(s.w)+"×"+s.r).join(" · ")}${gLine(k)}</span></div>`).join("")}</div></div>
  <p class="meta">Il massimale stimato usa la formula di Epley sulla serie migliore.</p>`;

function chart(pts){
  const W=340,H=170,pl=36,pr=12,pt=14,pb=26;
  if(pts.length<2) return `<p class="meta" style="margin:10px 0 0">Il grafico appare dalla seconda seduta. Per ora: ${fmt(pts[0].w)} kg il ${dShort(pts[0].k)}.</p>`;
  let lo=Math.min(...pts.map(p=>p.w)),hi=Math.max(...pts.map(p=>p.w));
  if(hi===lo){lo-=5;hi+=5;} const pad=(hi-lo)*.15; lo=Math.max(0,lo-pad); hi+=pad;
  const x=i=>pl+(W-pl-pr)*i/(pts.length-1), y=v=>pt+(H-pt-pb)*(1-(v-lo)/(hi-lo));
  const ticks=[lo,(lo+hi)/2,hi];
  const path=pts.map((p,i)=>(i?"L":"M")+x(i).toFixed(1)+" "+y(p.w).toFixed(1)).join(" ");
  const area=path+` L${x(pts.length-1).toFixed(1)} ${H-pb} L${pl} ${H-pb} Z`;
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Andamento del peso massimo">
  ${ticks.map(t=>`<line x1="${pl}" x2="${W-pr}" y1="${y(t)}" y2="${y(t)}" stroke="var(--line)" stroke-width="1"/><text x="${pl-6}" y="${y(t)+4}" text-anchor="end" font-size="10" fill="var(--muted)">${fmt(Math.round(t*2)/2)}</text>`).join("")}
  <path d="${area}" fill="var(--accent)" opacity=".15"/>
  <path d="${path}" fill="none" stroke="var(--accent-text)" stroke-width="2.5" stroke-linejoin="round"/>
  ${pts.map((p,i)=>`<circle cx="${x(i)}" cy="${y(p.w)}" r="${i===pts.length-1?4.5:3}" fill="${i===pts.length-1?"var(--accent)":"var(--surface)"}" stroke="var(--accent-text)" stroke-width="2"/>`).join("")}
  <text x="${pl}" y="${H-8}" font-size="10" fill="var(--muted)">${dShort(pts[0].k)}</text>
  <text x="${W-pr}" y="${H-8}" font-size="10" fill="var(--muted)" text-anchor="end">${dShort(pts[pts.length-1].k)}</text></svg>`;
}

/* ---------- Garmin via Home Assistant ---------- */
const HA="Ha-Casa";
const GE={sonno:"sensor.sleep_score",durata:"sensor.sleep_duration",bb:"sensor.body_battery_most_recent",hrv:"sensor.garmin_connect_hrv_last_night_average",hrvBase:"sensor.garmin_connect_hrv_baseline",hrvStatus:"sensor.hrv_status",fc:"sensor.resting_heart_rate",cal:"sensor.active_kilocalories",calTot:"sensor.total_kilocalories",passi:"sensor.total_steps",passiGoal:"sensor.daily_step_goal",sync:"sensor.garmin_connect_last_synced"};
const GINPUT={entity_id:Object.values(GE),fields:["state"]};
const HRVIT={balanced:"bilanciato",unbalanced:"sbilanciato",low:"basso",poor:"scarso"};
let garmin={status:"loading"}, MCP=null;
function parseG(p){
  try{if(typeof p==="string")p=JSON.parse(p);}catch(e){return null;}
  const st=(p&&p.data&&p.data.states)||(p&&p.states); if(!st) return null;
  const raw=k=>{const s=st[GE[k]];const v=s&&s.state;return v==null||v==="unknown"||v==="unavailable"?null:v;};
  const n=k=>{const v=parseFloat(raw(k));return isFinite(v)?Math.round(v):null;};
  return {sonno:n("sonno"),durata:n("durata"),bb:n("bb"),hrv:n("hrv"),hrvBase:n("hrvBase"),hrvStatus:raw("hrvStatus"),fc:n("fc"),cal:n("cal"),calTot:n("calTot"),passi:n("passi"),passiGoal:n("passiGoal"),sync:raw("sync")};
}
function verdict(d){
  const st=(d.hrvStatus||"").toLowerCase();
  if((d.bb!=null&&d.bb<25)||(d.sonno!=null&&d.sonno<50)||st==="low"||st==="poor")
    return {k:"low",t:"Giornata leggera",m:"Recupero scarso: tieni i pesi della volta scorsa o scendi un po'."};
  if((d.bb!=null||d.sonno!=null)&&(d.bb==null||d.bb>=50)&&(d.sonno==null||d.sonno>=70)&&(!st||st==="balanced"))
    return {k:"high",t:"Pronto a spingere",m:"Buon recupero: se l'app propone di salire di peso, provaci."};
  return {k:"mid",t:"Giornata normale",m:"Segui la scheda e sali di peso solo se le prime serie vanno bene."};
}
const DENY=["needs_reauth","server_not_connected","blocked_by_policy","approval_required","not_in_manifest","selection_required","server_not_found"];
function onGarmin(result){const d=parseG(result&&result.payload);garmin=d?{status:"ok",data:d}:{status:"error",code:"parse"};softRender();}
function onGarminErr(e){const c=(e&&e.code)||"upstream_error";if(DENY.includes(c)||garmin.status!=="ok")garmin={status:"error",code:c};softRender();}
async function initGarmin(){
  if(!window.claude||!window.claude.use){garmin={status:"absent"};softRender();return;}
  MCP=await claude.use("mcp");
  if(!MCP){garmin={status:"absent"};softRender();return;}
  initActs();
  MCP.watchTool(HA,"ha_get_state",GINPUT,ev=>{ev.type==="data"?onGarmin(ev.result):onGarminErr(ev.error);},{refetchInterval:600000,cache:{staleTime:300000,gcTime:3600000}});
}
function askGarmin(){if(!MCP)return;garmin={status:"loading"};render();MCP.callTool(HA,"ha_get_state",GINPUT).then(onGarmin,onGarminErr);}
function snapGarmin(){
  if(garmin.status!=="ok")return; const k=dayKey(Date.now()); state.garmin=state.garmin||{};
  if(state.garmin[k])return; const d=garmin.data;
  state.garmin[k]={sonno:d.sonno,durata:d.durata,bb:d.bb,hrv:d.hrv,fc:d.fc}; saveGarmin();
}
function gLine(k){const g=state.garmin&&state.garmin[k];if(!g)return "";const p=[];
  if(g.sonno!=null)p.push("Sonno "+g.sonno);if(g.bb!=null)p.push("Body Battery "+g.bb);if(g.hrv!=null)p.push("HRV "+g.hrv);
  return p.length?"<br><small>"+p.join(" · ")+"</small>":"";}
const hm=m=>Math.floor(m/60)+"h"+String(m%60).padStart(2,"0");
function vGarmin(){
  if(garmin.status==="absent") return "";
  const head=`<div class="row between"><div class="label">Stato fisico · Garmin</div>${garmin.status==="ok"?`<button class="btn sm ghost" data-act="grefresh">${garmin.refreshing?"Aggiorno…":"Aggiorna"}</button>`:""}</div>`;
  if(garmin.status==="loading") return `<div class="card gcard">${head}<p class="meta" style="margin:0">Leggo sonno, Body Battery e HRV da Home Assistant…</p></div>`;
  if(garmin.status==="error"){
    const c=garmin.code;
    const msg={server_not_connected:"Per vedere i dati Garmin inserisci indirizzo e token di Home Assistant in Impostazioni.",
      needs_reauth:"Home Assistant ha rifiutato il token: controllalo in Impostazioni.",
      approval_required:"Serve il tuo permesso per leggere i dati Garmin da Home Assistant.",
      not_in_manifest:"La lettura dei dati Garmin non è consentita per questa app.",
      selection_required:"Scegli quale connettore Home Assistant usare quando claude.ai te lo chiede.",
      blocked_by_policy:"Le impostazioni dell'organizzazione bloccano la lettura da Home Assistant.",
      parse:"Home Assistant ha risposto, ma i sensori Garmin non sono stati trovati."}[c]||"Home Assistant non risponde in questo momento: riprovo da solo tra qualche minuto.";
    const btn=(c==="approval_required"||c==="not_in_manifest")?`<button class="btn sm primary" data-act="gallow">Consenti lettura</button>`:"";
    return `<div class="card gcard">${head}<p class="meta" style="margin:0">${msg}</p>${btn}</div>`;
  }
  const d=garmin.data, v=verdict(d);
  const sync=d.sync?new Date(d.sync):null;
  const syncTxt=sync&&!isNaN(sync)?(dayKey(sync)===dayKey(Date.now())?"oggi alle ":dShort(dayKey(sync))+" alle ")+String(sync.getHours()).padStart(2,"0")+":"+String(sync.getMinutes()).padStart(2,"0"):"";
  const m=(lab,val,unit,det)=>`<div><div class="label">${lab}</div><div class="v">${val==null?"–":val}${val!=null&&unit?`<small> ${unit}</small>`:""}</div>${det?`<div class="d">${det}</div>`:""}</div>`;
  return `<div class="card gcard">${head}
    <div class="verdict ${v.k}"><b>${v.t}</b><p>${v.m}</p></div>
    <div class="gm">${m("Sonno",d.sonno,"/100",d.durata!=null?hm(d.durata)+" di sonno":"")}
    ${m("Body Battery",d.bb,"/100","")}
    ${m("HRV notte",d.hrv,"ms",d.hrvStatus?"stato "+(HRVIT[d.hrvStatus.toLowerCase()]||d.hrvStatus):"")}
    ${m("FC a riposo",d.fc,"bpm","")}
    ${m("Passi oggi",d.passi!=null?d.passi.toLocaleString("it-IT"):null,"",d.passiGoal?"obiettivo "+d.passiGoal.toLocaleString("it-IT")+(d.passi!=null?" \u00b7 "+Math.round(d.passi/d.passiGoal*100)+"%":""):"")}
    ${m("Calorie attive",d.cal,"kcal",d.calTot!=null?"su "+d.calTot.toLocaleString("it-IT")+" kcal totali":"")}</div>
    ${syncTxt?`<div class="meta">Orologio sincronizzato ${syncTxt}. I dati vengono salvati con la seduta.</div>`:""}</div>`;
}

function parseDur(v){const p=String(v).trim().split(/[:.,]/).map(x=>parseInt(x,10));if(p.some(isNaN)||!p.length)return NaN;

}

  else if(g==="Braccia"){ if(/curl/.test(n)){P("bicipiti");S("avambracci");} else P("tricipiti"); }

// Legge una scheda in PDF (tabella ESERCIZI / SERIE / RIPETIZIONI / PAUSE / NOTE) e la trasforma in schede dell'app.
async function leggiSchedaPdf(pdfjs, data){
  const doc=await pdfjs.getDocument({data,isEvalSupported:false}).promise;
  const righe=[];
  for(let p=1;p<=doc.numPages;p++){
    const page=await doc.getPage(p), tc=await page.getTextContent();
    const items=tc.items.filter(i=>i.str&&i.str.trim()).map(i=>({s:i.str,x:i.transform[4],y:i.transform[5],w:i.width||0}));
    items.sort((a,b)=>b.y-a.y||a.x-b.x);
    const gruppi=[];
    for(const it of items){const g=gruppi.find(g=>Math.abs(g.y-it.y)<3);if(g)g.items.push(it);else gruppi.push({y:it.y,items:[it]});}
    gruppi.sort((a,b)=>b.y-a.y).forEach(g=>{g.items.sort((a,b)=>a.x-b.x);righe.push(g.items);});
  }
  return interpreta(righe);
}
const testo=r=>r.map(i=>i.s).join(" ").replace(/\s+/g," ").trim();
function unisci(items){ // unisce i pezzi vicini in "celle"
  const out=[];
  for(const it of items){const l=out[out.length-1];
    if(l&&it.x-(l.x+l.w)<8){l.s+=(it.x-(l.x+l.w)>1.5?" ":"")+it.s;l.w=it.x+it.w-l.x;} else out.push({...it});}
  return out;
}
function interpreta(righe){
  const schede=[], note=[]; let cur=null, cols=null, inNote=false;
  for(const r of righe){
    const t=testo(r), T=t.toUpperCase();
    const g=t.match(/^(\d+)\s*°?\s*GIORNO\s*(.*)$/i);
    if(g){cur={nome:"Giorno "+g[1]+(g[2]?" · "+bello(g[2]):""),esercizi:[]};schede.push(cur);cols=null;inNote=false;continue;}
    if(/^N\s*O\s*T\s*E\b/.test(T)){inNote=true;continue;}
    if(/^ESERCIZI\b/.test(T)&&/\bSERIE\b/.test(T)){
      cols={};r.forEach(i=>{const k=i.s.toUpperCase();
        if(/SERIE/.test(k))cols.serie=i.x+i.w/2; else if(/RIPET/.test(k))cols.rip=i.x+i.w/2; else if(/PAUS|RECUP/.test(k))cols.pausa=i.x+i.w/2; else if(/NOTE/.test(k))cols.note=i.x+i.w/2;});
      inNote=false;continue;}
    if(inNote&&!cur){const n=t.replace(/^[•\-•·*]\s*/,"");if(n)note.push(n);continue;}
    if(!cur||!cols)continue;
    const celle=unisci(r); const nomeParts=[], val={serie:"",rip:"",pausa:"",note:[]};
    const limiteNome=cols.serie-25;
    for(const c of celle){
      const cx=c.x+c.w/2;
      if(c.x+c.w<=limiteNome+20&&c.x<limiteNome){nomeParts.push(c.s);continue;}
      const confineNote=cols.note!=null?(cols.pausa!=null?(cols.pausa+cols.note)/2:cols.note-40):1e9;
      if(c.x>=confineNote-5||cx>=confineNote){val.note.push(c.s);continue;}
      const d={serie:Math.abs(cx-cols.serie),rip:Math.abs(cx-cols.rip),pausa:cols.pausa!=null?Math.abs(cx-cols.pausa):1e9};
      const k=Object.keys(d).sort((a,b)=>d[a]-d[b])[0]; val[k]=(val[k]+" "+c.s).trim();
    }
    const nome=nomeParts.join(" ").replace(/\s+/g," ").trim(); const serie=parseInt(val.serie,10);
    if(!nome||!(serie>0))continue;
    const rp=parseRip(val.rip);
    cur.esercizi.push({nome,serie,rMin:rp.min,rMax:rp.max,u:rp.u,rec:parsePausa(val.pausa),nota:val.note.join(" ").trim()});
  }
  schede.forEach(s=>s.note=note.slice());
  return schede.filter(s=>s.esercizi.length);
}
function bello(s){s=s.replace(/[_]+/g," e ").replace(/\s+/g," ").trim().toLowerCase();return s.charAt(0).toUpperCase()+s.slice(1);}
function parseRip(v){v=String(v||"").trim();
  const u=/[’'′]/.test(v)&&!/[”"″]/.test(v)?"min":/[”"″]|sec/i.test(v)?"sec":"rip";
  const n=v.match(/\d+/g)||["10"]; const a=parseInt(n[0],10), b=n[1]?parseInt(n[1],10):a;
  return {min:Math.min(a,b),max:Math.max(a,b),u};}
function parsePausa(v){v=String(v||"").trim(); if(!v||/^[-–—]$/.test(v))return 0;
  let m=v.match(/(\d+)\s*[’'′]\s*(\d+)?/); if(m)return parseInt(m[1],10)*60+(m[2]?parseInt(m[2],10):0);
  m=v.match(/(\d+)/); return m?parseInt(m[1],10):90;}

const STOP=new Set(["con","alla","al","ai","allo","da","di","e","o","il","la","le","lo","a","in","per","del","della"]);
const tok=n=>slug(n).split("-").filter(w=>w&&!STOP.has(w)).sort().join(" ");
function indovina(n){const s=n.toLowerCase();
  const g=/cardio|tapis|ellittic|bike|cyclette/.test(s)?"Cardio":/addomin|crunch|plank|russian|ab wheel/.test(s)?"Addome"
   :/polpacc|calf|\bleg\b|squat|affond|rumeno|hip thrust|glute|hack|belt|adductor|abductor/.test(s)?"Gambe"
   :/curl|scott|bicip|push ?down|french|overhead|tricip|kickback|\bdip/.test(s)?"Braccia"
   :/alzate|shoulder|military|lento|face pull|spalle|deltoid|posterior|tirate|scrollat/.test(s)?"Spalle"
   :/panca|chest|croci|pector|spinte|petto|\bfly\b|piegament/.test(s)?"Petto"
   :/\blat\b|pull|pulley|rematore|\brow\b|t-bar|trazion|dorso|stacco|hyperext/.test(s)?"Schiena":"Altro";
  const e=g==="Cardio"?"Cardio":/manubri/.test(s)?"Manubri":/cav[oi]|pulley|corda|push ?down/.test(s)?"Cavi":/bilanciere|\basta\b|\bmp\b|panca piana/.test(s)?"Bilanciere":/addomin|trazion|piegament|corpo libero/.test(s)?"Corpo libero":"Macchina";
  return {g,e};}
function trovaEsercizio(nome){
  const t=tok(nome), all=[...CAT,...(state.custom||[])];
  const hit=all.find(c=>tok(c.n)===t); if(hit) return hit.id;
  const g=indovina(nome), id="c-"+slug(nome)+"-"+uid().slice(0,3);
  (state.custom||(state.custom=[])).push({id,n:nome,g:g.g,e:g.e}); return id;
}

async function apriPdf(file){
  pdfLoading=true; render();

let tEnd=0,tTotal=0,tName="",tInt=null,tBeeped=false,AC=null,wake=null;

function beep(){if(!AC)return;try{[0,.3,.6].forEach((d,i)=>{const o=AC.createOscillator(),g=AC.createGain();o.frequency.value=i===2?1320:880;o.connect(g);g.connect(AC.destination);const t=AC.currentTime+d;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.35,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+.22);o.start(t);o.stop(t+.25);});}catch(e){}try{navigator.vibrate&&navigator.vibrate([200,100,200]);}catch(e){}}
let tFrom=null,tPause=null;
function startTimer(sec,name,from){tFrom=from||null;tPause=null;tTotal=sec;tEnd=Date.now()+sec*1000;tName=name;tBeeped=false;clearInterval(tInt);tInt=setInterval(tick,250);tick();}

  ${left>0?`<button data-act="tpause">${tPause!=null?"Riprendi":"Pausa"}</button>`:""}<button data-act="tadd">+15s</button><button data-act="tskip">${left>0?"Salta":"Ok"}</button>

    case "runcancel": runPick=null; runForm=false; render(); break;
    case "runsave": saveRunForm(); break;
    case "rundel": {const id=b.dataset.id; if(confirmDel===id){const r=(state.runs||[]).find(x=>x.id===id); state.runs=(state.runs||[]).filter(x=>x.id!==id); if(r&&r.g){state.runsHidden=state.runsHidden||[];state.runsHidden.push(r.g);} saveRuns(); confirmDel=null; toast("Corsa eliminata"); render();} else {confirmDel=id; render();} break;}
    case "grefresh": if(MCP){garmin.refreshing=true;render();MCP.invalidate(HA,"ha_get_state").catch(()=>{});setTimeout(()=>{garmin.refreshing=false;softRender();},4000);} break;
    case "start": sessId=b.dataset.id; draft={}; keepAwake(); go("sessione"); break;
    case "log": {
      const k=b.dataset.k, inW=document.querySelector(`[data-d="${k}"][data-f="w"]`), inR=document.querySelector(`[data-d="${k}"][data-f="r"]`);
      const w=inW?num(inW.value):0, r=Math.round(num(inR.value));
      if(!(w>=0)||!(r>0)){toast("Inserisci peso e ripetizioni");return;}
      if(w>=400){toast("Il peso deve essere inferiore a 400 kg");inW&&inW.focus();return;}
      const t=Date.now(), mk=monthKey(t);
      (state.months[mk]||(state.months[mk]=[])).push({t,ex:b.dataset.ex,w,r,s:sessId});
      delete draft[k]; saveMonth(mk); snapGarmin(); render();
      if(+b.dataset.rec>0) startTimer(+b.dataset.rec,exInfo(b.dataset.ex).n,b.dataset.ex+"@"+t); break;}
    case "undo": {
      const t=+b.dataset.t, mk=monthKey(t);
      state.months[mk]=(state.months[mk]||[]).filter(x=>!(x.t===t&&x.ex===b.dataset.ex));
      saveMonth(mk);
      const stop=(tInt||tPause!=null)&&tFrom===b.dataset.ex+"@"+t; if(stop) stopTimer();
      render(); toast(stop?"Serie annullata, recupero fermato":"Serie annullata"); break;}
    case "extra": draft[b.dataset.ex+":extra"]=(draft[b.dataset.ex+":extra"]||0)+1; render(); break;
    case "timer": startTimer(+b.dataset.rec,b.dataset.name); break;
    case "tpause":
      if(tPause!=null){tEnd=Date.now()+tPause;tPause=null;clearInterval(tInt);tInt=setInterval(tick,250);}
      else{tPause=Math.max(0,tEnd-Date.now());clearInterval(tInt);tInt=null;}
      tick(); break;
    case "tadd": if(tPause!=null){tPause+=15000;tTotal+=15;tick();break;} tEnd=Math.max(tEnd,Date.now())+15000; tTotal+=15; tBeeped=false; tick(); break;
    case "tskip": stopTimer(); break;
    case "finish": {
      const today=dayKey(Date.now()); const ss=allSets().filter(x=>x.s===sessId&&dayKey(x.t)===today);
      stopTimer(); try{wake&&wake.release();}catch(err){}
      toast(ss.length?`Allenamento salvato: ${ss.length} serie, ${fmt(Math.round(ss.reduce((a,x)=>a+x.w*x.r,0)))} kg di volume`:"Nessuna serie segnata oggi");
      go("oggi"); break;}
    case "edit": editId=b.dataset.id; go("modifica"); break;
    case "new": {const id=uid(); state.schede.push({id,nome:"Scheda "+String.fromCharCode(65+state.schede.length%26),esercizi:[]}); saveConfig(); editId=id; go("modifica"); break;}
    case "mv": {const i=+b.dataset.i,d=+b.dataset.d,arr=s.esercizi;[arr[i],arr[i+d]]=[arr[i+d],arr[i]];saveConfig();render();break;}
    case "rm": s.esercizi.splice(+b.dataset.i,1); saveConfig(); render(); break;
    case "del": if(confirmDel===s.id){state.schede=state.schede.filter(x=>x.id!==s.id);saveConfig();toast("Scheda eliminata");go("schede");}else{confirmDel=s.id;render();} break;
    case "pick": pick={open:true,q:"",g:"Tutti"}; renderSheet(); break;
    case "closepick": pick.open=false; renderSheet(); break;
    case "pg": pick.g=b.dataset.g; renderSheet(); break;
    case "add": s.esercizi.push({ex:b.dataset.ex,serie:3,rMin:8,rMax:12,rec:90}); saveConfig(); pick.open=false; renderSheet(); render(); toast(exInfo(b.dataset.ex).n+" aggiunto"); break;
    case "addcustom": {
      const n=document.getElementById("cn").value.trim(); if(!n){toast("Scrivi il nome dell'esercizio");return;}
      const id="c-"+slug(n)+"-"+uid().slice(0,3);
      (state.custom||(state.custom=[])).push({id,n,g:document.getElementById("cg").value,e:document.getElementById("ce").value});
      s.esercizi.push({ex:id,serie:3,rMin:8,rMax:12,rec:90}); saveConfig(); pick.open=false; renderSheet(); render(); toast(n+" aggiunto"); break;}
  }
});
let saveT=null;
const debSave=()=>{clearTimeout(saveT);saveT=setTimeout(saveConfig,600);};
document.addEventListener("input",e=>{
  const t=e.target;
  if(t.dataset.d){const k=t.dataset.d;(draft[k]||(draft[k]={}))[t.dataset.f]=t.value;
    if(t.dataset.f==="w")t.classList.toggle("bad",num(t.value)>=400);return;}
  if(t.id==="pq"){pick.q=t.value;const pos=t.selectionStart;renderSheet();const n=document.getElementById("pq");n.focus();try{n.setSelectionRange(pos,pos);}catch(err){}return;}
  const s=state.schede.find(x=>x.id===editId); if(!s) return;
  if(t.id==="sn"){s.nome=t.value.trim()||"Senza nome";debSave();return;}
  if(t.dataset.ed!=null&&t.tagName==="INPUT"){const e2=s.esercizi[+t.dataset.ed],v=parseInt(t.value,10);if(v>0){e2[t.dataset.f]=Math.min(v,t.dataset.f==="serie"?10:100);debSave();}}
});
document.addEventListener("change",e=>{
  const t=e.target;
  if(t.id==="pe"){progEx=t.value;render();return;}
  const s=state.schede.find(x=>x.id===editId); if(!s) return;
  if(t.dataset.ed!=null){const e2=s.esercizi[+t.dataset.ed];
    if(t.tagName==="SELECT") e2.rec=+t.value;
    if(e2.rMin>e2.rMax){e2.rMax=e2.rMin;}
    saveConfig(); if(t.tagName!=="SELECT") render();}
});
document.addEventListener("visibilitychange",()=>{if(!document.hidden&&view==="sessione")keepAwake();});

render(); renderSync(); initCloud(); initGarmin();
</script>

<script>
/* Notifica di fine recupero (anche a schermo spento) e tasto Indietro */
(function(){
  const P=window.Capacitor&&Capacitor.isNativePlatform&&Capacitor.isNativePlatform()&&Capacitor.Plugins; if(!P) return;
  const LN=P.LocalNotifications; let pronto=null;
  const init=()=>pronto||(pronto=(async()=>{try{await LN.requestPermissions();
    await LN.createChannel({id:"recupero",name:"Fine recupero",description:"Avviso quando il recupero è finito",importance:5,visibility:1,vibration:true});}catch(e){}})());
  async function sync(){ if(!LN) return; await init();
    try{await LN.cancel({notifications:[{id:1}]});}catch(e){}
    if(tInt&&tPause==null&&tEnd>Date.now()+1500){
      try{await LN.schedule({notifications:[{id:1,title:"Recupero finito",body:"Prossima serie: "+tName,channelId:"recupero",schedule:{at:new Date(tEnd),allowWhileIdle:true}}]});}catch(e){}}}
  document.addEventListener("click",e=>{const b=e.target.closest("[data-act]"); if(!b) return;
    if(["log","undo","timer","tpause","tadd","tskip","finish"].includes(b.dataset.act)) setTimeout(sync,60);});
  if(P.App) P.App.addListener("backButton",()=>{
    if(pick&&pick.open){pick.open=false;renderSheet();return;}
    if(view==="oggi") P.App.minimizeApp(); else go(view==="modifica"?"schede":"oggi");});
})();
</script>
