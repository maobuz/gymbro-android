name: Compila APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Installa Capacitor
        run: npm install --no-audit --no-fund

      - name: Crea il progetto Android
        run: npx cap add android

      - name: Icone
        continue-on-error: true
        run: npx --yes @capacitor/assets@3.0.5 generate --android --iconBackgroundColor '#15181c' --iconBackgroundColorDark '#15181c' --splashBackgroundColor '#15181c' --splashBackgroundColorDark '#15181c'

      - name: Permessi e versione
        run: node ci/patch-android.js ${{ github.run_number }}

      - name: Copia l'app web nel progetto
        run: npx cap sync android

      - name: Compila
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Rinomina
        run: cp android/app/build/outputs/apk/debug/app-debug.apk GymBro.apk

      - name: Controlla che la firma sia sempre la stessa
        run: |
          keytool -printcert -jarfile GymBro.apk | tee firma.txt
          grep -q "6A:35:8B:78:79:59:15:82:45:D1:AD:DB:76:11:F7:88:F1:3E:02:9B:67:AF:00:96:12:43:1F:2E:7D:BA:FD:18" firma.txt

      - uses: actions/upload-artifact@v4
        with:
          name: GymBro-apk
          path: GymBro.apk

      - name: Pubblica per il download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: GymBro 1.${{ github.run_number }}
          files: GymBro.apk
          make_latest: true
          body: |
            Scarica **GymBro.apk** dal telefono e installalo (sopra la versione precedente: i dati restano).
